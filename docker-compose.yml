# =============================================================================
#  PRODUCT CONFIGURATOR DOCKER COMPOSE
# =============================================================================
# Complete Docker setup for Product Configurator application with PostgreSQL database
# Includes database initialization, migrations, and seeding
# =============================================================================

services:
  # -----------------------------------------------------------------------------
  #  DATABASE SERVICE (PostgreSQL)
  # -----------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: product-configurator-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=quickbom
      - POSTGRES_PASSWORD=quickbom_password
      - POSTGRES_DB=quickbom
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - product-configurator-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U quickbom -d quickbom" ]
      interval: 10s
      timeout: 5s
      retries: 5

  #  PRODUCT CONFIGURATOR APPLICATION
  # -----------------------------------------------------------------------------
  product-configurator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-configurator-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000" # Expose on port 5000
    environment:
      # Application Configuration
      - NODE_ENV=production
      - PORT=5000
      - NEXT_PUBLIC_APP_NAME=Product Configurator - Management System

      # Database Configuration
      - DATABASE_URL=postgresql://quickbom:quickbom_password@db:5432/quickbom?schema=public
      - DIRECT_URL=postgresql://quickbom:quickbom_password@db:5432/quickbom

      # JWT Configuration (generate secure secrets in production)
      - JWT_SECRET=${JWT_SECRET}

      # Disable Next.js telemetry
      - NEXT_TELEMETRY_DISABLED=1

    volumes:
      # Mount uploads directory for persistent file storage
      - ./uploads:/app/uploads
      # Mount data directory for seeds and static data
      - ./data:/app/data:ro

    networks:
      - product-configurator-network

    restart: unless-stopped

    # Health check for the application
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  #  DATABASE MIGRATION SERVICE
  # -----------------------------------------------------------------------------
  migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-configurator-migration
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database Configuration
      - DATABASE_URL=postgresql://quickbom:quickbom_password@db:5432/quickbom?schema=public
      - DIRECT_URL=postgresql://quickbom:quickbom_password@db:5432/quickbom
      - NODE_ENV=production

    volumes:
      - ./prisma:/app/prisma:ro

    networks:
      - product-configurator-network

    command: >
      sh -c " echo 'Pushing Prisma schema to database...' && npx prisma db push --accept-data-loss && echo 'Running database seeding...' && npm run db:seed && echo 'Migration and seeding completed!' "

    profiles:
      - migration # Only runs when explicitly requested with --profile migration

# -----------------------------------------------------------------------------
#  NETWORKS
# -----------------------------------------------------------------------------
networks:
  product-configurator-network:
    driver: bridge
    name: product-configurator-network

volumes:
  postgres_data:


